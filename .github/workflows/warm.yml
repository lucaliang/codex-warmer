name: Codex quota warmer
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-quota-warmer
  cancel-in-progress: false
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      WARM_MODEL: ${{ vars.WARM_MODEL || 'gpt-6-luna' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require credential persistence permission
        run: |
          test -n "$GH_TOKEN" || { echo 'GH_PAT is required before enabling warm-ups.'; exit 1; }
      - name: Restore authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          umask 077
          mkdir -p "$HOME/.codex"
          test -n "$CODEX_AUTH_JSON"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
      - name: Verify secret write permission on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$HOME/.codex/auth.json"
          echo 'Secret write permission verified.'
      - name: Install pinned Codex CLI
        run: npm install -g @openai/codex@0.144.1 --ignore-scripts
      - name: Check, warm and verify
        id: warm
        run: python3 scripts/warm.py
      - name: Record send and daily heartbeat
        if: ${{ always() && steps.warm.outcome != 'skipped' }}
        run: |
          date -u +%F > heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add heartbeat.txt
          if test -f .state/codex-last-warm.txt; then git add .state/codex-last-warm.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update warmer state'
            git pull --rebase
            git push
          fi
      - name: Clean authentication
        if: always()
        run: rm -f "$HOME/.codex/auth.json"
  notify:
    needs: warm
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RESULT: ${{ needs.warm.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Maintain failure issue
        run: |
          existing=$(gh issue list --repo "$REPO" --state open --json number,title --jq '[.[] | select(.title == "Codex warmer needs attention")][0].number // empty')
          if test "$RESULT" = failure; then
            if test -z "$existing"; then
              printf 'Warm-up or credential persistence failed. Inspect the run: %s\nNever paste login credentials into an issue.\n' "$RUN_URL" > "$RUNNER_TEMP/issue.md"
              gh issue create --repo "$REPO" --title 'Codex warmer needs attention' --body-file "$RUNNER_TEMP/issue.md"
            fi
          elif test "$RESULT" = success && test -n "$existing"; then
            gh issue close "$existing" --repo "$REPO" --comment 'A subsequent workflow completed successfully. This may be a valid skip; inspect the run for activation status.'
          fi
